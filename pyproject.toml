[project]
name = "tretikavka-speech"
version = "1.0.0"
description = ""
authors = [
    {name = "Sergey Yalovoy",email = "s.yalovoy@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "greenlet (>=3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "stressonnx (>=0.0.2,<0.0.3)",
    "ru-normalizr (>=0.3.0,<0.4.0)",
    "torch (>=2.13.0,<3.0.0)",
    "natasha (>=1.6.0,<2.0.0)",
    "boto3 (>=1.43.77,<2.0.0)",
    "scipy (>=1.18.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
